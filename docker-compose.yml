services:
  app:
    build: .
    ports:
      - "8080:80"
  dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      # keep the container's (Linux) node_modules out of the host checkout
      - /app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
